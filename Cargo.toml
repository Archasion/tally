[package]
name = "tally"
version = "0.1.0"
edition = "2024"
# let-chains and 2024 edition features; tested with 1.94.
rust-version = "1.88"
description = "A terminal invoice manager for UK sole traders, with PDF invoices via Typst"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
csv = "1"
directories = "6"
opener = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "backup", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
toml = "1.1.6"
tui-input = "0.15"
typst = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
